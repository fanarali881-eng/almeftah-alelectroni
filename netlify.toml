[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/mojaz/captcha"
  to = "/.netlify/functions/mojaz/captcha"
  status = 200

[[redirects]]
  from = "/api/mojaz/search"
  to = "/.netlify/functions/mojaz/search"
  status = 200

[[redirects]]
  from = "/api/mojaz/*"
  to = "/.netlify/functions/mojaz/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
